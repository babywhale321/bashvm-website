<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#333333">
    <title>bashvm</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #707070;
            color: #333;
            line-height: 1.5;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 80px auto 20px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            text-align: center;
            color: #000;
            font-size: clamp(1.6rem, 6vw, 2rem);
            margin: 0 0 0.6em;
        }

        p {
            text-align: center;
            font-size: clamp(1rem, 3.6vw, 1.1em);
            overflow-wrap: break-word;
        }

        a {
            color: #000;
            font-weight: bold;
            text-decoration: underline;
        }

        a:hover {
            text-decoration: none;
        }

        a:focus-visible {
            outline: 3px solid #333;
            outline-offset: 3px;
        }

        #menu {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        #menu summary {
            display: inline-flex;
            align-items: center;
            min-height: 48px;
            padding: 12px 20px;
            background-color: #333;
            color: #fff;
            font-size: 17px;
            cursor: pointer;
            user-select: none;
            list-style: none;
            border-bottom-right-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #menu summary::-webkit-details-marker {
            display: none;
        }

        #menu nav {
            display: flex;
            flex-direction: column;
            margin-top: 2px;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            background-color: #333;
            border-bottom-right-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        #menu nav a {
            display: flex;
            align-items: center;
            min-height: 44px;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: normal;
            white-space: nowrap;
            transition: background-color 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        @media (hover: hover) {
            #menu summary:hover,
            #menu[open] summary {
                background-color: #000;
                color: #fff;
            }

            #menu nav a:hover {
                background-color: #000;
                color: #fff;
            }
        }

        #menu summary:focus-visible,
        #menu nav a:focus-visible {
            outline: 3px solid #fff;
            outline-offset: -3px;
        }

        @media (max-width: 600px) {
            #menu {
                right: 0;
            }

            #menu summary {
                display: flex;
                justify-content: center;
                width: 100%;
                min-height: 48px;
                padding: 10px 16px;
                padding-top: calc(10px + env(safe-area-inset-top, 0px));
                font-size: 16px;
                border-radius: 0;
            }

            #menu nav {
                width: 100%;
                border-radius: 0;
            }

            #menu nav a {
                min-height: 48px;
                padding: 14px 20px;
                font-size: 15px;
            }

            .container {
                margin: 68px 10px 10px;
                padding: 16px;
                border-radius: 6px;
            }
        }
    </style>
</head>
<body>
    <details id="menu">
        <summary>Menu</summary>
        <nav>
            <a href="index.html">Home</a>
            <a href="download.html">Download</a>
            <a href="documentation.html">Documentation</a>
            <a href="screenshots.html">Screenshots</a>
            <a href="sponsors.html">Sponsors</a>
            <a href="donate.html">Donate</a>
            <a href="https://github.com/babywhale321/bashvm">Github</a>
        </nav>
    </details>

    <div class="container">
        <h1>Sponsors</h1>
        <p>Huge thanks to <a href="https://metalvps.com">MetalVPS</a> for their contribution and support!</p>
    </div>
</body>
</html>
